# Site claim + redirect suites (GitLab #332).
#
# The truth pins in test/ (public-claim accuracy, compliance-claim refusal,
# redirect contract) only prevent anything if they run on every change.
# Dependency-free node:test — no install step.
#
# External actions are pinned to immutable commit SHAs; workflow
# permissions are least-privilege (read-only contents).

name: Site tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site-tests:
    name: Claim and redirect suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run the suites
        run: node --test 'test/*.test.js'
      - name: Build the site (allowlist build must stay runnable)
        run: bash scripts/build-site.sh

  a11y:
    name: Accessibility (axe-core, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Only two dev dependencies, both pinned in package-lock.json:
      # playwright-core (no bundled browsers) and axe-core.
      - name: Install
        run: npm ci
      # ubuntu-latest ships Google Chrome, so playwright-core drives it
      # directly and nothing downloads a browser at CI time.
      - name: Locate Chrome
        run: |
          which google-chrome || which google-chrome-stable
          google-chrome --version || google-chrome-stable --version
          echo "CHROMIUM_PATH=$(which google-chrome || which google-chrome-stable)" >> "$GITHUB_ENV"
      - name: Run the accessibility gate
        run: npm run test:a11y
